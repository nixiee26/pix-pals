<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIX PALS — Distraction Blocked!</title>
  <style>
    body {
      background-color: #fbf8f2;
      color: #2c221e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #ffffff;
      border: 3px solid #2c221e;
      box-shadow: 6px 6px 0px 0px rgba(44, 34, 30, 0.95);
      border-radius: 8px;
      padding: 40px;
      max-width: 480px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #df793b;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #55443a;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #488053;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border: 2px solid #2c221e;
      box-shadow: 3px 3px 0px 0px rgba(44, 34, 30, 0.95);
      font-weight: bold;
      border-radius: 6px;
    }
    .btn:hover {
      background: #3b6b44;
      transform: translate(1px, 1px);
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 48px; margin-bottom: 16px;">🐾 🛑</div>
    <h1>Hold On! Focus in Progress</h1>
    <p>Your Pix Pal is currently shielding you from distractions. Stay strong — your session will be finished soon!</p>
    <a href="javascript:history.back()" class="btn">Return to Focus Session</a>
  </div>
</body>
</html>
